name: Plugin Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@f843725ad77b43b2bcc5225e09cca43f2cac6424 # v1.2.670
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
